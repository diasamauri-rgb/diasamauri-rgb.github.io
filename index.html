<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agrinho 2026</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->
<div id="intro" class="intro">

  <div class="intro-box">
    <h1>🌱 Agrinho 2026</h1>
    <p>Campo + Tecnologia + Futuro</p>

    <button id="enterBtn">▶ Entrar</button>

    <!-- 🎵 MÚSICA -->
    <audio id="music">
      <source src="audio/sementes-do-bem.mp3" type="audio/mpeg">
    </audio>

  </div>

</div>

<!-- SITE -->
<div id="site" style="display:none;">

<header>
  <h1>🌱 Agrinho 2026</h1>
</header>

<main>

<section class="section">
  <h2>🌾 Sobre o Agro</h2>
  <p>
    O agro é essencial para a nossa vida. Ele produz alimentos e conecta o campo com a cidade.
  </p>
</section>

<!-- QUIZ -->
<section class="section">
  <h2>🧠 Quiz Educativo</h2>

  <p id="qtext">Clique para iniciar</p>
  <div id="answers"></div>

  <p id="score"></p>

  <button onclick="startQuiz()">Iniciar Quiz</button>
</section>

</main>

</div>

<script src="script.js"></script>
</body>
</html>
